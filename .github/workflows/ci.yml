---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Check formatting
        run: mise run fmt-check

      - name: Check module metadata
        run: mise run tidy-check

      - name: Run go vet
        run: mise run vet

      - name: Check generated files
        run: mise run generate-check

      - name: Check annotations
        run: mise run annotations

      - name: Check comment policy
        run: mise run comments

      - name: Check agent adapters
        run: mise run agent-policy

      - name: Lint and audit workflows
        run: mise run workflow-lint

      - name: Run govulncheck
        run: mise run vulncheck

  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Cache golangci-lint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/golangci-lint
          key: ${{ runner.os }}-golangci-lint-${{ hashFiles('go.sum', '.golangci.yml', '.mise/mise.lock') }}

      - name: Run linter
        run: mise run lint

  test:
    name: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked

      - name: Cache Go
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: Run tests
        run: mise run test

      - name: Report coverage
        run: go tool cover -func=coverage.out | tail -1

  container:
    name: container
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install: false

      - name: Resolve Go version
        id: tools
        run: echo "go=$(mise config get tools.go)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: koment:ci
          build-args: GO_VERSION=${{ steps.tools.outputs.go }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run binary
        run: docker run --rm koment:ci help

      - name: Exercise unified service
        env:
          SYNCHRONIZATION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token="$RUNNER_TEMP/koment-synchronization-token"
          printf '%s' "$SYNCHRONIZATION_TOKEN" > "$token"
          chmod 0444 "$token"
          docker run --detach --name koment-ci-service \
            --publish 127.0.0.1:18080:8080 \
            --mount type=bind,src="$PWD/testdata/server/repositories.yaml",dst=/config/repositories.yaml,readonly \
            --mount type=bind,src="$token",dst=/config/synchronization-token,readonly \
            koment:ci serve --config /config/repositories.yaml \
              --github-token-file /config/synchronization-token \
              --listen 0.0.0.0:8080 --trusted-proxies 127.0.0.1/32
          cleanup() {
            docker logs koment-ci-service
            docker rm --force koment-ci-service
            rm -f "$token"
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/readyz; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:18080/livez
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18080/r/koment/)" = 401

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0

      - name: Exercise Helm release
        env:
          SYNCHRONIZATION_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          diagnostics() {
            kubectl get deployments,pods,services --all-namespaces
            kubectl describe pods --namespace default
            kubectl logs deployment/koment-koment --namespace default || true
          }
          trap diagnostics ERR
          kind load docker-image koment:ci --name chart-testing
          kubectl create secret generic koment-synchronization \
            --from-literal=github-token="$SYNCHRONIZATION_TOKEN"
          helm upgrade --install koment charts/koment \
            --set image.repository=koment \
            --set-string image.tag=ci \
            --set image.pullPolicy=Never \
            --set github.existingSecret=koment-synchronization \
            --wait --timeout 5m
          helm test koment --logs --timeout 2m

  setup-action:
    name: setup-action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Explain why the published release is not installed here
        if: github.event_name == 'push'
        run: |
          echo "::notice::A push to main can be a release commit, whose tag becomes 'latest'" \
               "minutes before its archives are uploaded. The release workflow verifies its own" \
               "output once publication finishes."

      - name: Install koment
        id: setup
        if: github.event_name != 'push'
        uses: ./

      - name: Verify installation
        if: github.event_name != 'push'
        env:
          INSTALLED_VERSION: ${{ steps.setup.outputs.version }}
        run: |
          command -v koment
          koment version
          test -n "$INSTALLED_VERSION"
          koment version | grep -q "$INSTALLED_VERSION"

  windows-archive:
    name: windows-archive (advisory)
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Install the published Windows archive the way Scoop and WinGet do
        if: github.event_name != 'push'
        shell: pwsh
        env:
          KOMENT_SOURCE: koment-dev/koment
        run: |
          $ErrorActionPreference = 'Stop'

          $resolved = (Invoke-WebRequest -Uri "https://github.com/$env:KOMENT_SOURCE/releases/latest" -UseBasicParsing).BaseResponse.RequestMessage.RequestUri.AbsoluteUri
          $tag = ($resolved -split '/')[-1]
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+') {
            throw "could not resolve a koment release from $resolved"
          }

          $archive = "koment_${version}_windows_amd64.zip"
          $base = "https://github.com/$env:KOMENT_SOURCE/releases/download/$tag"
          $work = New-Item -ItemType Directory -Force -Path (Join-Path $env:RUNNER_TEMP 'koment-windows')

          Write-Host "installing koment $version (windows/amd64)"
          Invoke-WebRequest -Uri "$base/$archive" -OutFile (Join-Path $work $archive) -UseBasicParsing
          Invoke-WebRequest -Uri "$base/koment_${version}_checksums.txt" -OutFile (Join-Path $work 'checksums.txt') -UseBasicParsing

          $listed = Select-String -Path (Join-Path $work 'checksums.txt') -Pattern " $([regex]::Escape($archive))$"
          if (-not $listed) {
            throw "$archive is not listed in the release checksum manifest"
          }
          $expected = ($listed.Line -split '\s+')[0]
          $actual = (Get-FileHash -Path (Join-Path $work $archive) -Algorithm SHA256).Hash.ToLower()
          if ($expected -ne $actual) {
            throw "${archive}: expected $expected, got $actual"
          }
          Write-Host "${archive}: OK"

          $extracted = Join-Path $work 'extracted'
          Expand-Archive -Path (Join-Path $work $archive) -DestinationPath $extracted -Force
          foreach ($member in @('koment.exe', 'LICENSE', 'README.md')) {
            if (-not (Test-Path (Join-Path $extracted $member))) {
              throw "$member is not at the root of $archive"
            }
          }
          Write-Host 'archive root carries koment.exe, LICENSE and README.md'

          $reported = (& (Join-Path $extracted 'koment.exe') version) -join ' '
          Write-Host $reported
          if ($reported -notmatch [regex]::Escape($version)) {
            throw "koment.exe reported '$reported', which does not name $version"
          }

  helm:
    name: helm
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install_args: --locked

      - name: Lint chart
        run: mise run helm-lint

      - name: Render supported modes
        run: mise run helm-template

  editor:
    name: editor
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Mise
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          experimental: true
          install: false

      - name: Install the pinned Go toolchain
        run: |
          set -euo pipefail
          mise install go --locked
          echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - name: Cache cross-compilation
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-cross-${{ hashFiles('go.sum') }}
          restore-keys: ${{ runner.os }}-go-cross-

      - name: Install locked editor tools
        run: mise --cd editors/vscode install --locked

      - name: Install editor packaging tools
        run: mise --cd editors/vscode exec -- npm ci

      - name: Test extension protocol
        run: mise run extension-test

      - name: Build the archives the extension bundles
        run: |
          set -euo pipefail
          test "$(go env GOVERSION)" = "go$(mise config get tools.go)"
          version=0.0.0-ci
          mkdir -p archives
          cp LICENSE README.md archives/
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary=koment
            [ "$os" = windows ] && binary=koment.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o "archives/${binary}" ./cmd/koment
            name="koment_${version}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd archives && zip -q "${name}.zip" "$binary" LICENSE README.md && rm "$binary")
            else
              (cd archives && tar -czf "${name}.tar.gz" "$binary" LICENSE README.md && rm "$binary")
            fi
          done
          rm archives/LICENSE archives/README.md
          (cd archives && sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > "koment_${version}_checksums.txt")

      - name: Validate every VSIX
        run: |
          set -euo pipefail
          version=0.0.0-ci
          manifest=editors/vscode/package.json
          cp "$manifest" "$RUNNER_TEMP/package.json"
          trap 'cp "$RUNNER_TEMP/package.json" "$manifest"' EXIT
          node -e "
            const p = require('./editors/vscode/package.json');
            p.version = '$version';
            require('fs').writeFileSync('editors/vscode/package.json', JSON.stringify(p, null, 2) + '\n');
          "
          ./editors/vscode/package-vsix.sh "$version" archives dist >/dev/null

          for pair in linux-x64:koment linux-arm64:koment darwin-x64:koment darwin-arm64:koment \
                      win32-x64:koment.exe win32-arm64:koment.exe; do
            target=${pair%%:*}
            expected=${pair##*:}
            package="dist/koment-vscode_${version}_${target}.vsix"
            carried=$(unzip -l "$package" | awk '/extension\/bin\//{print $NF}' | sed 's|extension/bin/||')
            test "$carried" = "$expected" || {
              echo "::error::$package carries '$carried', expected '$expected'"
              exit 1
            }
            unzip -p "$package" extension.vsixmanifest | grep -q "TargetPlatform=\"${target}\"" || {
              echo "::error::$package is not declared for $target"
              exit 1
            }
            echo "$package: $expected for $target"
          done

          universal="dist/koment-vscode_${version}.vsix"
          if unzip -l "$universal" | grep -q 'extension/bin/'; then
            echo "::error::the universal package must carry no binary"
            exit 1
          fi
          echo "$universal: no binary, falls back to PATH"

  ci:
    if: ${{ always() }}
    name: ci
    needs:
      - container
      - editor
      - helm
      - lint
      - quality
      - test
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Reject failed, cancelled, or skipped jobs
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1

      - name: Accept successful jobs
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')) }}
        run: echo "All CI jobs passed"
