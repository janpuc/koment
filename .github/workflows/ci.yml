name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Named "test" because the branch ruleset requires a check by that name.
  test:
    name: test
    runs-on: ubuntu-24.04
    # The Postgres driver is a claim in ADR 0022; a service container makes it
    # a tested one rather than an assertion.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: koment
          POSTGRES_DB: koment
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: vet
        run: go vet ./...

      - name: test
        env:
          KOMENT_TEST_DATABASE_URL: postgres://postgres:koment@localhost:5432/koment?sslmode=disable
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

      # koment's own annotations must still resolve. The demo fixture keeps its
      # own store under demo/.koment, so its deliberate drift is not seen here.
      - name: annotations resolve
        run: |
          go build -o koment ./cmd/koment
          ./koment check

  lint:
    name: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.12.2

  container:
    name: container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          load: true
          tags: koment:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A container that cannot start is a broken release, and the distroless
      # base has no shell to debug it with after the fact.
      - name: the binary runs
        run: docker run --rm koment:ci help

  # The action is what docs/publishing.md tells people to copy. It installs a
  # published release, so this exercises what a user actually gets rather than
  # what is in the tree.
  action:
    name: setup action
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: setup
        uses: ./

      - name: koment is on PATH and reports the release it installed
        run: |
          set -euo pipefail
          command -v koment
          koment version
          test -n "${{ steps.setup.outputs.version }}"
          koment version | grep -q "${{ steps.setup.outputs.version }}"

      # The published tier end to end, on a real repository, with the binary a
      # user would have downloaded.
      - name: it can publish a site
        run: |
          set -euo pipefail
          koment site --out /tmp/site --name ci
          test -f /tmp/site/index.html
          grep -q "snapshot of" /tmp/site/index.html

  chart:
    name: helm chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: lint
        run: helm lint charts/koment

      - name: renders in every supported mode
        run: |
          for mode in ui mcp-http mcp-streamable; do
            helm template koment charts/koment --set "mode=$mode" > /dev/null
          done

      - name: an unsupported mode is refused
        run: |
          if helm template koment charts/koment --set mode=write >/dev/null 2>&1; then
            echo "a writable mode rendered; ADR 0011 forbids it without auth"
            exit 1
          fi

      - name: validate against Kubernetes schemas
        run: |
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          helm template koment charts/koment | /tmp/kubeconform -strict -summary
