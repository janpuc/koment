name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: build
        run: go build -o koment ./cmd/koment

      # A snapshot with unresolved drift must never publish: the demo is
      # evidence the tool works, so it has to be green to be worth showing.
      - name: annotations resolve
        run: ./koment check

      - name: export
        run: |
          ./koment export --out dist \
            --banner "Snapshot of koment's own annotations at ${GITHUB_SHA::7}, rebuilt on every push. This is a static export; read your own code with \`koment ui\`." \
            --banner-link "https://github.com/${GITHUB_REPOSITORY}"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
