name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o koment ./cmd/koment

      - name: check koment
        run: |
          ./koment check
          ./koment comments check
          ./koment agents check

      - name: render koment
        run: |
          ./koment site --out dist --name koment \
            --commit "${GITHUB_SHA}" \
            --commit-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --repository-links "koment=index.html,workspace=r/workspace/index.html" \
            --banner "Annotations about the code that implements koment."

      - name: check maintained workspace
        working-directory: workspace
        run: ../koment check

      - name: render maintained workspace
        working-directory: workspace
        run: |
          ../koment site --out ../dist/r/workspace --name workspace \
            --commit "${GITHUB_SHA}" \
            --commit-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --repository-links "koment=../../index.html,workspace=index.html" \
            --banner "A maintained session package used to verify koment end to end." \
            --banner-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main/workspace"

      - name: verify publication
        run: |
          test -f dist/.nojekyll
          test -n "$(find dist/f -path '*/.*' -name '*.html' -print -quit)"
          test -f dist/index.html
          test -f dist/annotations.json
          test -f dist/search.json
          test -f dist/r/workspace/index.html
          test -f dist/r/workspace/annotations.json
          test -f dist/r/workspace/search.json
          grep -q "snapshot of" dist/index.html
          grep -q "snapshot of" dist/r/workspace/index.html
          grep -q "r/workspace/index.html" dist/index.html
          grep -q "../../index.html" dist/r/workspace/index.html
          echo "default and maintained repositories are stamped with ${GITHUB_SHA::7}"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
