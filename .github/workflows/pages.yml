name: pages

# This repository publishing itself is an instance of the documented pattern,
# not a special case: docs/publishing.md is the same workflow with one site.
# It builds koment from source rather than installing a release, because the
# site has to show what is on main. Everyone else should use the action.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o koment ./cmd/koment

      # Two sites, because the published tier is one repository per site
      # (ADR 0026). koment's own annotations are the persuasive half — real
      # reasoning about real code. The fixture is the only place drifted and
      # orphaned can be shown, because CI keeps main green and those two
      # statuses fail the build (ADR 0021).
      - name: render koment
        run: |
          ./koment site --out dist/koment --name koment \
            --commit-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --banner "Real annotations about real code — each was written because an edit was about to lose a real reason."

      - name: render the fixture
        working-directory: demo
        run: |
          ../koment site --out ../dist/fixture --name fixture \
            --commit-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}" \
            --banner "A fixture whose drift is deliberate, so that drifted and orphaned are visible somewhere." \
            --banner-link "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/main/demo"

      - name: landing page
        run: cp demo/landing.html dist/index.html

      # A site that silently rendered nothing would still deploy green.
      - name: every status is visible, and every page dates itself
        run: |
          for status in ok moved drifted orphaned; do
            grep -qr "pill $status" dist || { echo "no page shows status: $status"; exit 1; }
          done
          test -f dist/index.html || { echo "no landing page"; exit 1; }
          for site in koment fixture; do
            test -f "dist/$site/index.html" || { echo "$site render missing"; exit 1; }
            grep -q "snapshot of" "dist/$site/index.html" || { echo "$site does not name its commit"; exit 1; }
          done
          echo "all four statuses present; both sites stamped with ${GITHUB_SHA::7}"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
