name: demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: go build -o koment ./cmd/koment

      # The demo renders demo/, whose drift is deliberate, so it is exported
      # without a check. koment's own annotations are gated in ci.yml instead.
      - name: export the demo
        working-directory: demo
        run: |
          ../koment export --out ../dist \
            --banner "A fixture, not a live view. Every status below is deliberate, so the demo can show what drifted and orphaned look like — which koment's own repository never can, because CI keeps it green. Rebuilt from ${GITHUB_SHA::7}." \
            --banner-link "https://github.com/${GITHUB_REPOSITORY}"

      # A demo that silently rendered nothing would still deploy green.
      - name: the demo shows every status
        run: |
          for status in ok moved drifted orphaned; do
            grep -qr "pill $status" dist || { echo "demo is missing status: $status"; exit 1; }
          done
          echo "all four statuses present"

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
