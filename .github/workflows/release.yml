name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens and maintains a release pull request. Merging it tags the release,
  # which is what triggers publishing below.
  please:
    name: release please
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Tier 1 has to be installable without a Go toolchain, and the setup action
  # downloads these (ADR 0026).
  binaries:
    name: publish binaries
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # CGO is already off, so one runner cross-compiles every target and a
      # build matrix would only add six jobs' worth of scheduling.
      - name: build
        env:
          VERSION: ${{ needs.please.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp LICENSE README.md dist/
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${target%/*}
            arch=${target#*/}
            binary=koment
            [ "$os" = windows ] && binary=koment.exe

            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.releaseVersion=${VERSION} -X main.sourceRevision=${GITHUB_SHA}" \
              -o "dist/${binary}" ./cmd/koment

            name="koment_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd dist && zip -q "${name}.zip" "$binary" LICENSE README.md && rm "$binary")
            else
              (cd dist && tar -czf "${name}.tar.gz" "$binary" LICENSE README.md && rm "$binary")
            fi
          done
          rm dist/LICENSE dist/README.md
          (cd dist && sha256sum ./*.tar.gz ./*.zip | sed 's| \./| |' > "koment_${VERSION}_checksums.txt")
          ls -l dist

      - name: attach to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.please.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/koment_*.tar.gz dist/koment_*.zip dist/koment_*_checksums.txt \
            --clobber

  image:
    name: publish image
    needs: please
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.please.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.please.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: publish chart
    needs: [please, image]
    if: needs.please.outputs.released == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      CHART_VERSION: ${{ needs.please.outputs.version }}
      REGISTRY_OWNER: ${{ github.repository_owner }}
      REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      # OCI, so there is no chart repository to host and no index to regenerate.
      - name: package and push
        run: |
          helm registry login ghcr.io \
            --username "$REGISTRY_USER" \
            --password "$REGISTRY_PASSWORD"
          helm package charts/koment --destination /tmp
          helm push "/tmp/koment-${CHART_VERSION}.tgz" \
            "oci://ghcr.io/${REGISTRY_OWNER}/charts"
