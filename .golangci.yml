# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - errorlint
    - staticcheck
    - govet
    - ineffassign
    - unused
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - copyloopvar
    - gosec
    - revive

  disable:
    - noctx

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: internal/repository/
        text: "G703|G304"
        linters:
          - gosec
      - path: internal/ui/
        text: "G703"
        linters:
          - gosec
      - path: internal/anchor/
        text: "G304"
        linters:
          - gosec
      - path: internal/auth/
        text: "G304"
        linters:
          - gosec
      - path: internal/provenance/
        text: "G204"
        linters:
          - gosec
      - path: internal/server/configuration\.go
        text: "G304"
        linters:
          - gosec
      - path: internal/(mcp|metrics|server|ui)/
        text: "G118"
        linters:
          - gosec
      - path: internal/ui/export\.go
        text: "G301|G306"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/koment-dev/koment

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
