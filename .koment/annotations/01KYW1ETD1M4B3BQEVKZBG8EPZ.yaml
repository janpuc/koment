file: internal/cli/cli.go
kind: gotcha
body: |-
  flag.FlagSet.Parse stops at the first argument that is not a flag, so
  "koment add main.go --kind why --body x" parses zero flags and reports the
  rest as six stray arguments. The file has to come off the front before Parse
  sees the slice. DESIGN.md documents the file-first order, so the parser
  bends rather than the interface. The CLI tests caught this, not review.
created: "2026-07-31"
