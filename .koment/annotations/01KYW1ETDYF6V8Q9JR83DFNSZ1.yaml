  excerpt: func warningFor(status anchor.Status) string {
  before: "\t}\n}\n"
  after: "\tswitch status {\n\tcase anchor.StatusAmbiguous:\n\t\treturn \"STALE: the excerpt matches several places and its context does not identify one. \" +"
