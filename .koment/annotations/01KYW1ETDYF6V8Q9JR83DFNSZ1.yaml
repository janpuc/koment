file: internal/application/snapshot.go
kind: invariant
title: Every failing status must carry prose spelling the consequence
body: |-
  ADR 0005 requires that a drifted annotation is never served to an agent as
  though it described the current code. The status field alone does not
  achieve that - an agent has no reason to know what "drifted" costs it. Every
  failing status must carry prose that spells out the consequence. A new
  status added to internal/anchor needs a case here, or it will be served
  silently and confidently wrong.
created: "2026-07-31"
anchor:
  scope: excerpt
  excerpt: func WarningFor(status anchor.Status) string {
  before: |-
    }

    // WarningFor is the single stale-record warning policy for every surface.
  after: "\tswitch status {\n\tcase anchor.StatusAmbiguous:\n\t\treturn \"STALE: the excerpt matches several places and its context does not identify one. Treat it as history until someone explicitly reanchors it.\""
  last_seen_line: 109
