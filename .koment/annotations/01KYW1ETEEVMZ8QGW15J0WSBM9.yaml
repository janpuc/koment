  scope: excerpt
  excerpt: "\t\tif a.Excerpt == \"\" {"
  before: "\t\t}\n\t\treturn nil\n\tcase ScopeExcerpt:"
  after: "\t\t\treturn fmt.Errorf(\"annotation %s: excerpt anchor requires a non-empty excerpt\", id)\n\t\t}\n\t\tif a.LastSeenLine < 1 {"
  last_seen_line: 112
