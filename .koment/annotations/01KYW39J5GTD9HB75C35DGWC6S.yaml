  excerpt: "\tmoved := *record"
  before: "\t\t}\n\t}\n"
  after: "\tif err := reanchorTo(&moved, annotations, target, *excerpt); err != nil {\n\t\treturn fail(env, err)\n\t}"
  last_seen_line: 38
