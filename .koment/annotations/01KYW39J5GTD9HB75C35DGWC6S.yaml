  type: why
  title: Reanchor keeps the same id and date; only the target moves
  body: |-
    Re-anchoring keeps the annotation's ULID and its created date on purpose.
    The annotation is the same annotation; only where it points changed.
    Deleting and re-adding would be simpler code but would mint a new id and a
    new date, so the record would claim to be younger than the thinking in it,
    and would sever it from its own git history. ADR 0012.
  anchor:
    scope: excerpt
    excerpt: func (s *Service) Reanchor(input ReanchorInput) (Mutation, error) {
    before: |-
      }

      // Reanchor changes only an annotation's target.
    after: "\trecord, err := s.store.FindByID(input.ID)\n\tif err != nil {\n\t\treturn Mutation{}, err"
