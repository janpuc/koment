body: |-
  An annotation that only changes file keeps its existing excerpt rather than
  requiring it to be retyped. This is the renamed-file case, which is the
  common one: the code did not change, its path did. Passing --excerpt as well
  is still allowed, for a rename that also edited the annotated lines.
