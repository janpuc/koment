version: 1
id: 01KYW39J5RCPKYCH1865WPHG82
file: internal/application/service.go
kind: gotcha
title: File-only reanchor inherits the existing excerpt
body: |-
  An annotation that only changes file keeps its existing excerpt rather than
  requiring it to be retyped. This is the renamed-file case, which is the
  common one: the code did not change, its path did. Passing --excerpt as well
  is still allowed, for a rename that also edited the annotated lines.
created: "2026-07-31"
anchor:
  scope: excerpt
  excerpt: excerpt := input.Excerpt
  before: "\t\t\treturn Mutation{}, err\n\t\t}\n\t}"
  after: "\tif excerpt == \"\" && record.Anchor.Scope == store.ScopeExcerpt {\n\t\texcerpt = record.Anchor.Excerpt\n\t}"
  last_seen_line: 98
author:
  name: Legacy import
  kind: unknown
  source: migration
