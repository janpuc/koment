title: Every request rebuilds the view from disk; nothing is cached
body: |-
  Every request rebuilds the whole view from the working tree rather than
  caching it at startup. This is the point of a local tool: what is on screen
  is what is on disk, so editing a file and refreshing shows the drift you
  just caused. Caching would reintroduce exactly the staleness koment exists
  to detect. The cost is re-reading every annotated file per request, which is
  milliseconds at repository scale.
created: "2026-07-31"
