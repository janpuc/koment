  excerpt: func describe(resolution anchor.Resolution) note {
  before: |2-

    // describe renders a drifted annotation as history: its excerpt is shown as
    // what used to be there, never laid over the current source (ADR 0005).
  after: "\tstale := resolution.Status.IsFailure()\n\treturn note{\n\t\tID:      resolution.Annotation.ID,"
