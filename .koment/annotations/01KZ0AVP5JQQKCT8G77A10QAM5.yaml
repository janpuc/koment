  type: invariant
  title: Missing git is reported, not invented; wrong is worse than absent
  body: |-
    Reports ErrNoGit rather than guessing. A fabricated commit reference is
    worse than an absent one: an absent context degrades the historical view
    honestly, a wrong one sends a reader to the wrong file state and looks
    authoritative doing it.
  anchor:
    scope: excerpt
    excerpt: func Capture(root, file string, line, endLine int) (*store.GitContext, error) {
    before: |-
      // Capture records the commit an annotation was written against. It reports
      // ErrNoGit rather than guessing when git cannot answer, because a fabricated
      // commit reference is worse than an absent one.
    after: "\tcommit, err := git(root, \"rev-parse\", \"HEAD\")\n\tif err != nil {\n\t\treturn nil, ErrNoGit"
