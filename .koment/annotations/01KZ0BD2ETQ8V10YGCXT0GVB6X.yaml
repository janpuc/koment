file: internal/store/context.go
kind: invariant
title: Excerpt drives resolution; commit is reconstructed only for history
body: |-
  The excerpt and this context answer different questions and neither replaces
  the other. Resolution searches on the excerpt alone; the commit hash is
  consulted only to reconstruct history. Deleting every git block must leave
  every status unchanged - TestProvenanceIsOptional and the anchor tests pin
  that. If a change here makes resolution read the commit, ADR 0003 has been
  reversed without anyone deciding to.
created: "2026-08-02"
anchor:
  scope: excerpt
  excerpt: type GitContext struct {
  before: |-
    // GitContext is what was true when an annotation was written. It is written
    // once and never rewritten: reanchor changes where an annotation aims, not
    // what it witnessed. ADR 0014.
  after: "\tCommit  string `yaml:\"commit\"`\n\tPath    string `yaml:\"path\"`\n\tLine    int    `yaml:\"line,omitempty\"`"
  last_seen_line: 12
