  type: invariant
  title: Identity is a claim, not a proof; proven and unproven render apart
  body: |-
    The identity is a claim, not a proof. git config is trivially set to
    anything, so source records where it came from and the UI must render an
    unverified identity differently from a checked one. Rendering them
    identically would be a lie of omission, and it is the kind that gets
    believed because it looks like data rather than an assertion.
  anchor:
    scope: excerpt
    excerpt: func (a Author) IsProven() bool { return a.Verified != "" }
    before: |2-

      // IsProven reports whether the identity was verified by some mechanism. An
      // unverified identity must not be rendered as though it were checked.
