spec:
  target:
    file: internal/metrics/metrics.go
  type: invariant
  title: Every status is set on every sweep, zero included, for dashboards
  body: |-
    Every status is set on every sweep, including the ones at zero. Skipping a
    zero would make a drift that someone fixed look identical to a scrape gap:
    the series simply stops, and a dashboard cannot tell "no longer drifting"
    from "no longer reporting". Setting all four unconditionally costs three
    samples and removes the ambiguity.
  anchor:
    scope: excerpt
    excerpt: func (m *Metrics) ObserveRepository(resolved map[anchor.Status]int, files int, took time.Duration) {
    before: |-
      // ObserveRepository publishes a full sweep. Every status is set on every sweep,
      // including the zero ones: leaving a status unset would make a drift that was
      // fixed look like a scrape gap rather than a return to zero.
    after: "\tfor _, status := range []anchor.Status{\n\t\tanchor.StatusOK, anchor.StatusMoved, anchor.StatusAmbiguous, anchor.StatusDrifted, anchor.StatusOrphaned,\n\t} {"
