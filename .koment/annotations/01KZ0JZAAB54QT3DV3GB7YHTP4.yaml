kind: why
title: Sweep is timer-driven; scraping the metrics port must not do work
body: |-
  The sweep runs on a timer rather than when a scrape arrives. A sweep is
  O(annotations) and reads every annotated file, so wiring it to the scrape
  would let anyone who can reach the metrics port drive real work by scraping
  faster. The gauges are therefore up to sweepInterval stale, which is the
  correct trade for a number that changes when someone commits.
created: "2026-08-02"
