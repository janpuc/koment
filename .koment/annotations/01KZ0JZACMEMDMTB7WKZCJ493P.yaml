spec:
  target:
    file: internal/config/config.go
  type: invariant
  title: Explicit flag always beats the environment; flags stay overridable
  body: |-
    An explicit flag always beats the environment. That ordering is what makes a
    container debuggable: the deployment sets KOMENT_LISTEN and a person
    exec-ing in can still override it on the command line without editing the
    manifest. Reversing it would make the environment un-overridable, which is
    the frustrating half of every twelve-factor implementation that gets this
    backwards.
  anchor:
    scope: excerpt
    excerpt: func FromEnvironment(flags *flag.FlagSet) error {
    before: |-
      //
      // It runs after Parse because that is the only point at which "was this flag
      // actually given" is knowable.
    after: "\tgiven := map[string]bool{}\n\tflags.Visit(func(f *flag.Flag) { given[f.Name] = true })\n"
