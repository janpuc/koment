file: internal/config/config.go
kind: gotcha
title: FromEnvironment runs after Parse so Visit sees only set flags
body: |-
  This runs after Parse, not before, because flag.FlagSet.Visit only reports
  flags that were actually given - which is the entire signal needed to decide
  whether the environment should fill one in. Doing it before Parse would mean
  comparing against defaults, and a flag explicitly set to its default value
  would be indistinguishable from one that was omitted.
