file: internal/metrics/metrics.go
kind: why
title: Servers depend on a Recorder interface, never on Prometheus types
body: |-
  The Recorder interface exists so that neither server names a Prometheus
  type. Discard satisfies it, so a deployment without --metrics pays one
  interface call per request and links nothing it uses. This is weaker
  confinement than ADR 0007 bought for the MCP SDK - the servers do import
  this package - but it keeps every Prometheus API call inside
  internal/metrics, so removing the dependency stays mechanical.
created: "2026-08-02"
