spec:
  target:
    file: internal/metrics/middleware.go
  type: gotcha
  title: net/http discards the status code; capture it via WriteHeader
  body: |-
    net/http throws the status code away once it has been written, so the only
    way to record it is to intercept WriteHeader. The written flag matters: a
    handler that calls Write without WriteHeader implicitly sends 200, and a
    handler that calls WriteHeader twice would otherwise record the second,
    which net/http ignores.
  anchor:
    scope: excerpt
    excerpt: type recordingWriter struct {
    before: |2-

      // recordingWriter remembers the status code, which net/http otherwise discards
      // once it has been written.
    after: "\thttp.ResponseWriter\n\tcode    int\n\twritten bool"
