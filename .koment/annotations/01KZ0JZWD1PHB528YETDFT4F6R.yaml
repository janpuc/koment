file: internal/repository/repository.go
kind: gotcha
body: |-
  KOMENT_REPO is checked before the working directory because in a container
  the working directory is a mount point, not somewhere a person navigated to.
  Without it, running the image with the repository mounted anywhere other
  than the image's WORKDIR silently serves nothing, and the failure looks like
  an empty store rather than a misconfiguration.
