  type: invariant
  title: Identity is assigned, never computed from the filesystem path
  body: |-
    Identity is assigned, never computed from the path. Hashing the root meant
    that moving a checkout from /repos/api to /srv/api silently produced a
    different repository - new id, orphaned index, no error. ADR 0017 named that
    failure and shipped it anyway pending a registry; ADR 0024 is the registry.
    A configured id may not change: changing it is a rename, and koment cannot
    tell the difference, so the docs say so rather than pretending.
  anchor:
    scope: excerpt
    excerpt: func identifier(root string) string {
    before: |-
      // identifier names an unconfigured repository after its directory, falling back
      // to a hash only when that is not usable as an id. A configured repository
      // never reaches here — its id is assigned (ADR 0024).
    after: "\tbase := strings.ToLower(filepath.Base(root))\n\tcleaned := strings.Map(func(r rune) rune {\n\t\tswitch {"
