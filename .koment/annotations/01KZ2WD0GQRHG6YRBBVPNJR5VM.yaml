body: |-
  An ambiguous path fails and lists the candidates rather than choosing one.
  Answering from whichever repository the server happens to sit in is a
  confident wrong answer, which is the failure this whole project exists to
  prevent. Search behaves differently on purpose: searching everything and
  naming where each hit came from is useful, where refusing would not be. ADR
  0025.
created: "2026-08-03"
