kind: why
body: |-
  Three tools, and ADR 0005 said resist growing past two. This is the one
  override and ADR 0025 is its record: discovery is a distinct question from
  retrieval and from search, and an agent that cannot ask what is served has
  to guess a repository name. A per-repository tool set was rejected precisely
  because it grows with the data; this does not. There is no fourth question
  of this kind.
created: "2026-08-03"
