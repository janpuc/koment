spec:
  target:
    file: internal/ui/export.go
  type: invariant
  title: Static site refuses to render without a commit stamp (ADR 0026)
  body: |-
    Refusing here rather than rendering an unstamped page is deliberate. A
    static site is the one tier that cannot re-resolve, so the only thing
    bounding its staleness is the commit printed on every page. A site that
    silently omitted it would look exactly like a current one, which is the
    failure koment exists to prevent — so the absence of a commit is an error,
    not a missing decoration.

    The -dirty suffix matters for the same reason: `koment site` renders the
    working tree, so a modified tree is not the commit it sits on and must not
    claim to be.
  anchor:
    scope: excerpt
    excerpt: func commitOf(root, given string) (string, error) {
    before: |-
      // commitOf refuses to publish a snapshot that cannot say what it is a snapshot
      // of. An undated page is how a reader mistakes an old rendering for the current
      // one, which is the failure this project exists to prevent (ADR 0026).
    after: "\tif given != \"\" {\n\t\treturn given, nil\n\t}"
