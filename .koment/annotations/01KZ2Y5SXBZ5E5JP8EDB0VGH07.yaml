apiVersion: koment.dev/v1alpha
kind: Annotation
metadata:
  id: 01KZ2Y5SXBZ5E5JP8EDB0VGH07
  created: "2026-08-03T00:00:00Z"
spec:
  target:
    file: action.yml
  type: gotcha
  title: Resolve latest via the release redirect, not the REST API
  body: |-
    Resolving "latest" through the release redirect rather than the REST API is
    not a style choice. The API's unauthenticated rate limit is counted per
    source IP, which shared GitHub runners exhaust routinely; when they do, the
    response is an error document that a naive parse turns into an empty tag and
    a confusing download failure. The redirect needs no token, has no such
    limit, and puts the tag in the last path segment.
  anchor:
    scope: excerpt
    excerpt: '        if [ "$KOMENT_REQUESTED" = "latest" ]; then'
    before: |2-
              # Resolve "latest" through the release redirect rather than the REST
              # API: the API's unauthenticated rate limit is per IP, and shared
              # runners exhaust it in ways that are miserable to diagnose.
    after: |2-
                resolved=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
                  "https://github.com/${KOMENT_SOURCE}/releases/latest")
                tag=${resolved##*/}
  author:
    name: janpuc
    email: janpuc@proton.me
    kind: agent
    source: git-config
status:
  lastSeenLine: 54
