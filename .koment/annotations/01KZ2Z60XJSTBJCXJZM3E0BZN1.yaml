kind: gotcha
body: |-
  The absence check is load-bearing. severity[ok] is 0 and severity[missing
  key] is also 0, so a comparison alone never fires for the first annotation
  on a line and the marker would be dropped. The same zero-value trap already
  cost this project a bug in the file listing's worst-status roll-up.
created: "2026-08-03"
