spec:
  target:
    file: internal/ui/view.go
  type: gotcha
  title: The seen check is load-bearing; severity zero collides with absent
  body: |-
    The absence check is load-bearing. severity[ok] is 0 and severity[missing
    key] is also 0, so a comparison alone never fires for the first annotation
    on a line and the marker would be dropped. The same zero-value trap already
    cost this project a bug in the file listing's worst-status roll-up.
  anchor:
    scope: excerpt
    excerpt: "\t\tif !seen || statusSeverity[annotation.Status] > statusSeverity[worst] {"
    before: "\t\t}\n\t\tbuilt.Notes = append(built.Notes, described)\n\t\tworst, seen := marked[annotation.Line]"
    after: "\t\t\tmarked[annotation.Line] = annotation.Status\n\t\t}\n\t}"
  author:
    name: janpuc
    email: janpuc@proton.me
    kind: agent
    source: git-config
  git:
    commit: da6a27ee00b7a5abcf5d9f7bfe44d33ff0347a3e
    path: internal/ui/view.go
    line: 213
status:
