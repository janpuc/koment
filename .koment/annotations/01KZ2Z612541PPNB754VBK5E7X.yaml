spec:
  target:
    file: internal/ui/ui.go
  type: why
  title: Every URL names its repository; single-repo deploys still carry /r/
  body: |-
    Every path carries its repository, including when only one is served. A URL
    whose meaning depends on how the server happens to be configured is a URL
    nobody can share, and the single-repository case is exactly where that would
    go unnoticed until someone deployed a second one.

    Unlike koment_get, which refuses an ambiguous path (ADR 0025), the UI serves
    every configured repository. A person can see which one they are looking at,
    so there is no ambiguity to refuse.
  anchor:
    scope: excerpt
    excerpt: func Handler(repositories *repository.Set) http.Handler {
    before: |-
      // Handler routes the view. Every request re-reads the working tree, so what is
      // rendered is what is on disk rather than what was on disk at startup. Paths
      // are /r/<repository>/f/<file>.
    after: "\ttemplates := template.Must(template.ParseFS(assets, \"assets/*.html\"))\n\n\tmux := http.NewServeMux()"
