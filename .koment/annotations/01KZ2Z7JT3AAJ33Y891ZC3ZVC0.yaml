file: internal/ui/assets/style.css
kind: why
body: |-
  Two columns, and the notes are not in the code grid. Previously each line
  was a grid row with the note in a third cell, so the row grew to the tallest
  cell and a long note pushed the surrounding code apart — ten annotations
  turned a five-line const block into about thirty-five rendered lines.

  Keeping code and notes in separate columns is what makes line heights
  uniform regardless of how much prose is attached to any one line.
created: "2026-08-03"
