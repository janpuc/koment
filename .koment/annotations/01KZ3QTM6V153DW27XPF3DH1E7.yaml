spec:
  target:
    file: internal/ui/ui.go
  type: invariant
  title: Secure follows the connection, because loopback has none
  body: |-
    The capability server's default deployment is plain HTTP on an ephemeral
    loopback listener (ADR 0105), where a Secure cookie is never returned by
    the browser and write mode silently stops working. Setting the flag
    unconditionally would disable the feature it protects.

    So it follows the connection instead: TLS, or an X-Forwarded-Proto of
    https from a terminating proxy. Loopback keeps the previous protections
    unchanged - loopback is enforced before the token is created, HttpOnly and
    SameSite=Strict guard the browser boundary, the form repeats the token,
    Origin must match Host, and the bootstrap redirects to a fixed clean path.

    This replaced a blanket gosec directive. Suppressing the warning answered
    nothing for a deployment that does terminate TLS; the flag now tells the
    truth about the connection it was set on.
  anchor:
    scope: excerpt
    excerpt: "\t\t\t\tSameSite: http.SameSiteStrictMode, Secure: servedOverTLS(r),"
    before: "\t\tif r.Method == http.MethodGet && sameSecret(given, writeToken) {\n\t\t\thttp.SetCookie(w, &http.Cookie{\n\t\t\t\tName: capabilityCookie, Value: writeToken, Path: \"/\", HttpOnly: true,"
    after: "\t\t\t})\n\t\t\thttp.Redirect(w, r, \"/\", http.StatusSeeOther)\n\t\t\treturn"
