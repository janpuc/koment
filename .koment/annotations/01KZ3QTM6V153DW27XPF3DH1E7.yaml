kind: invariant
title: No Secure on loopback cookies; loopback is enforced before the token
body: |-
  The capability server intentionally uses plain HTTP on an ephemeral loopback
  listener, so a Secure cookie would not be returned by browsers and would
  disable write mode. Loopback is enforced before the token is created;
  HttpOnly and SameSite=Strict protect the cookie at the browser boundary, the
  form repeats the token, Origin must match Host, and the bootstrap redirects
  to a fixed clean path. The gosec G124 directive covers only the incompatible
  Secure-cookie requirement.
created: "2026-08-03"
