id: 01KZ5JZCPEJGHRG1VAQRKXVNSD
file: .github/workflows/ci.yml
kind: why
title: Readiness uses a job token; shared runners share anonymous GH limits
body: |-
  Readiness gates on a completed repository snapshot, so the service is only
  ready once it has read a tree from GitHub. Unauthenticated GitHub API calls
  are limited to 60 an hour per source address, and hosted runners share
  addresses, so this step failed whenever another job on the same address had
  spent the budget. The job token raises the limit and makes readiness depend
  on koment rather than on who else was building at the time.
created: "2026-08-04"
anchor:
  scope: excerpt
  excerpt: '          --github-token-file /config/synchronization-token \'
  before: |2-
                --mount type=bind,src="$PWD/testdata/server/repositories.yaml",dst=/config/repositories.yaml,readonly \
                --mount type=bind,src="$token",dst=/config/synchronization-token,readonly \
                koment:ci serve --config /config/repositories.yaml \
  after: |2-
                  --listen 0.0.0.0:8080 --trusted-proxies 127.0.0.1/32
