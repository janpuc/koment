kind: anti-pattern
body: |-
  windows-archive is missing from this list on purpose (ADR 0111). It installs
  the last published release rather than this pull request, because no Windows
  runner builds the change under review, so a red result can mean a runner
  image moved or a release has not happened yet. Adding it here makes an
  irreproducible check able to block unrelated work, and the first false red
  would get it deleted instead of demoted. It still runs and still reports; it
  just cannot stop a merge.
