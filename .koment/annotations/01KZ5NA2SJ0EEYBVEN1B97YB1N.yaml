spec:
  target:
    file: .github/workflows/ci.yml
  type: anti-pattern
  title: Do not add windows-archive or setup-action to required (ADR 0111, 0125)
  body: |-
    windows-archive and setup-action are missing from this list on purpose
    (ADR 0111 and ADR 0125). windows-archive installs the last published
    release rather than this pull request, because no Windows runner builds
    the change under review; setup-action installs the GitHub Action from
    the repository's checkout and exercises it on fresh runners, which makes
    its red result mean "GitHub Actions had a bad day" rather than "this
    code is wrong". Adding either here makes an infrastructure-flaky check
    able to block unrelated work, and the first false red would get it
    deleted instead of demoted. Both still run and still report; neither can
    stop a merge.
  anchor:
    scope: excerpt
    excerpt: |2-
            - quality
            - test
    before: |2-
            - helm
            - lint
    after: |2-
          runs-on: ubuntu-24.04
          permissions: {}
          steps:
