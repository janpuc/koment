spec:
  target:
    file: .github/workflows/ci.yml
  type: anti-pattern
  title: windows-archive and setup-action are required despite instability
  body: |-
    windows-archive installs the last published release rather than this pull
    request, because no Windows runner builds the change under review, so a red
    result can mean a runner image moved or a release has not happened yet.
    setup-action depends on downloading a released binary from GitHub, which
    fails when GitHub Actions has outages. Both are in the needs list because
    they provide signal on release health, not on code correctness. A red result
    here indicates a release problem, not a code problem.
  anchor:
    scope: excerpt
    excerpt: |2-
            - setup-action
            - test
            - windows-archive
    before: |2-
            - helm
            - lint
            - quality
    after: |2-
          runs-on: ubuntu-24.04
          permissions: {}
          steps:
