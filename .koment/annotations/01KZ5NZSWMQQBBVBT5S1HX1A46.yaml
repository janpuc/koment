spec:
  target:
    file: editors/vscode/binary.js
  type: gotcha
  title: koment.binaryPath defaults to empty so a user setting always wins
  body: |-
    koment.binaryPath defaults to empty, not to "koment". A default that is also
    a valid path cannot be told apart from a user who typed it, so the bundled
    binary could never win against an unset setting. Empty means unset; anything
    else is a deliberate override (ADR 0113).
  anchor:
    scope: excerpt
    excerpt: '  const explicit = (configured ?? '''').trim();'
    before: |-
      }

      function resolveBinary({ configured, extensionPath, platform, exists = fs.existsSync }) {
    after: |2-
        if (explicit) {
          return { command: explicit, source: 'configured' };
        }
  author:
    name: janpuc
    email: janpuc@proton.me
    kind: agent
    source: git-config
