file: editors/vscode/binary.js
kind: why
body: |-
  A VSIX is a zip and nothing in the extension host contract guarantees the
  executable bit survives expansion. It does survive on the paths tested here,
  but a server that cannot be executed fails exactly like a server that is
  missing, so the bit is asserted rather than assumed. A chmod failure is
  deliberately not caught; swallowing it would restore the failure this
  prevents.
created: "2026-08-04"
