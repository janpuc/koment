  type: invariant
  title: Bundled binary is the archive the release signed, never a rebuild
  body: |-
    The bundled binary must be the archive the release signed, never a rebuild.
    ADR 0109 rejected letting a channel build its own binary, because that lets
    one channel ship something never signed or attested, and a marketplace
    extension is a channel. This is why the release job depends on the binaries
    job and downloads its output instead of running go build itself.
  anchor:
