file: .github/workflows/ci.yml
kind: invariant
title: Only the ci aggregate is required; its name equals its job id
body: |-
  Every job's name equals its id, so a required check names the job that
  produced it. The aggregate is called ci rather than test because a job that
  runs the tests should be allowed to be called test.

  The branch ruleset requires only this job. It already fails when any
  dependency failed, was cancelled or was skipped, so listing the others as
  required checks duplicated that logic in a second place that no test covers.
  Adding a job to needs now gates merges without touching repository settings.
created: "2026-08-04"
