apiVersion: koment.dev/v1alpha
kind: Annotation
metadata:
  id: 01KZ6ATTKE1H16A642J8SK02Z8
  created: "2026-08-04T00:00:00Z"
spec:
  target:
    file: server.json
  type: gotcha
  title: OCI server.json has no version field; the tag is the version
  body: |-
    An OCI package here must carry no version field. The published JSON Schema
    permits one, so schema validation passes and the registry still rejects the
    publish with 400: "OCI packages must not have version field - include
    version in identifier instead". The version therefore lives in the tag,
    which the release workflow appends, and release-please no longer updates a
    package version that must not exist. Cost one broken release (0.3.0).
  anchor:
    scope: excerpt
    excerpt: '      "identifier": "ghcr.io/koment-dev/koment",'
    before: |2-
        "packages": [
          {
            "registryType": "oci",
    after: |2-
            "runtimeHint": "docker",
            "runtimeArguments": [
              {
