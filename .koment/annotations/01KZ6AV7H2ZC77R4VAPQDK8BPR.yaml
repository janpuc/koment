file: .github/workflows/release.yml
kind: gotcha
title: 'publish binaries needs id-token: write or cosign waits on a browser'
body: |-
  This job needs id-token: write for cosign. Without it cosign does not fail
  fast: it decides no ambient credential is available, prints "Non-interactive
  mode detected, using device flow" and waits five minutes for a browser that
  will never arrive. Signing sits before the upload step, so the job died
  having built every archive and attached none, and 0.3.0 shipped empty while
  latest pointed at it.
created: "2026-08-04"
