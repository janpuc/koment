file: .mise/config.toml
kind: gotcha
body: |-
  koment depends on a release of itself here, and that is deliberate but
  narrow. This entry exists so .mcp.json and .vscode/mcp.json, which both
  declare command: koment, resolve to something. The repository gates
  deliberately do not use it: annotations, comments and agent-policy all run
  go run ./cmd/koment so they judge the working tree rather than the last
  release.

  The consequence to remember is that editor and MCP tooling in this checkout
  speaks the released record format while the gates speak the one you are
  editing. If you change the record schema or a mutation surface, expect them
  to disagree until this pin moves.
