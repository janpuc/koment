file: internal/lsp/workspace.go
kind: invariant
title: Diagnostic slices are initialised so LSP never sees JSON null
body: |-
  Initialised, not declared with var. A nil Go slice marshals to JSON null,
  and LSP declares PublishDiagnosticsParams.diagnostics as an array, so a nil
  one puts null on the wire. Editor clients call .map on it and throw before
  rendering anything. The VS Code extension reported that as "koment could not
  start", which sent everyone looking at the binary.

  Any list this server sends needs the same treatment; a Go-level test cannot
  see the difference, so the assertion lives at the wire in
  TestListsReachTheWireAsArraysAndNeverAsNull.
created: "2026-08-04"
