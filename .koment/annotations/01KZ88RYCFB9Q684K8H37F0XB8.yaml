  target:
    file: internal/store/record.go
  type: why
  title: A title is capped so nothing has to truncate it
  body: |-
    The limit is the feature, not a guard. A title short enough to render beside
    code never needs shortening, so no surface has to choose where to cut.
    koment refuses a longer title at write time rather than accepting it and
    truncating on every read, which is what the removed inlineMaxLength setting
    used to tune (ADR 0115).
  anchor:
    scope: excerpt
    excerpt: const TitleLimit = 72
    before: |2-

      // TitleLimit keeps a title short enough to render beside code without being
      // shortened, which is the only reason it exists (ADR 0115).
    after: |2

      const SchemaURL = "https://raw.githubusercontent.com/janpuc/koment/main/schema/annotation.schema.json"
