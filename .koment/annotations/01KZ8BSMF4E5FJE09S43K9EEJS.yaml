kind: invariant
title: A unique resolution is ok, wherever it was found
body: |-
  The recorded line is deliberately not compared here. Resolution is a search,
  so an annotation follows its excerpt down the file on its own; comparing
  where it landed against last_seen_line reported a cache miss, not a fact
  about the code, and it was the ordinary case rather than the exception.
  Refreshing the record instead would make a read write, so koment check would
  dirty the working tree it was asked to inspect (ADR 0116).
created: "2026-08-05"
