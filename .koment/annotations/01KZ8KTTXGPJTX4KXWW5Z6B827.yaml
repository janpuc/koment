  type: why
  title: Opencode synthesises an apply_patch so one walker handles both clients
  body: |-
    Two clients (codex apply_patch, opencode edit/write) feed the same
    addedCommentIntent walker, but only the first produces the patch shape that
    walker expects. Rather than fork the analyzer, the opencode plugin sends a
    synthetic apply_patch whose lines are all marked added so the walker
    evaluates the post-edit file content unchanged. The cost is one tiny adapter
    function; the benefit is one comment-policy implementation.
  anchor:
    scope: excerpt
    excerpt: func syntheticPatchFromEdit(filePath, content string) string {
    before: "\treturn append(encoded, '\\n'), nil\n}\n"
    after: "\tvar builder strings.Builder\n\tbuilder.WriteString(\"*** Update File: \")\n\tbuilder.WriteString(filepath.ToSlash(filePath))"
