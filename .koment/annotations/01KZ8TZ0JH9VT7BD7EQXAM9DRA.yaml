  body: |-
    persistUpgrade rewrites a record that was read in the v1 shape. The upgrade
    itself already happened in memory, so a repository mounted read-only still
    reads correctly; only the rewrite fails, and the next writable read retries
    it. Failing the read instead would make every read-only deployment refuse a
    repository it can serve perfectly well.
