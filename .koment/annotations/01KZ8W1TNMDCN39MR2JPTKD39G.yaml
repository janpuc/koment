spec:
  target:
    file: internal/anchor/anchor.go
  type: why
  title: Status is an alias so the vocabulary has one owner
  body: |-
    A record persists the last observed resolution, so the store has to know the
    vocabulary in order to validate it. Declaring it a second time here as its
    own string type would let the two lists drift the moment a fifth status is
    added - which is exactly the class of failure ADR 0116 removed when it
    deleted `moved`. An alias keeps `anchor.StatusOK` reading naturally at the
    sixty-odd call sites that use it while there is still only one definition.
    It is a type alias, not a named type, so the two are the same type and no
    conversion can hide a mismatch.
  anchor:
    scope: excerpt
    excerpt: type Status = store.AnchorStatus
    before: |2-

      // Status is the record's own vocabulary. The store owns it because a record
      // persists the last observed one; naming it twice would let the two drift.
    after: "\nconst (\n\tStatusOK        = store.AnchorOK"
