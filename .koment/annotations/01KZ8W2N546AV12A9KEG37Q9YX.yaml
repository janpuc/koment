spec:
  target:
    file: internal/store/store.go
  type: invariant
  title: The upgrade happens in memory before it is ever written
  body: |-
    Order matters here. The record is fully upgraded and validated before
    anything touches the filesystem, which is what lets a read-only mount serve
    a v1 repository correctly: only the rewrite fails, and the caller gets the
    same record either way. Reversing this - rewriting first, then returning
    what was written - would make a container with a read-only workspace refuse
    a repository it can read perfectly well. ADR 0119.
  anchor:
    scope: excerpt
    excerpt: "\tannotation, upgraded, err := decodeAnnotation(id, content)"
    before: "\tif err != nil {\n\t\treturn nil, err\n\t}"
    after: "\tif err != nil {\n\t\treturn nil, err\n\t}"
