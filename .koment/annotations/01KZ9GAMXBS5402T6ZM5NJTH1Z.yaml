spec:
  target:
    file: .github/workflows/renovate.yml
  type: gotcha
  title: A permission 403 surfaces as "repository has changed"
  body: |-
    Renovate reports a missing token permission as `Repository has changed
    during renovation - aborting`, with `"result": "repository-changed"`. That
    message names neither the permission nor the request, and it is a
    plausible-sounding lie: it sent two investigations after a merge race and
    then a poisoned repository cache, both wrong, before anyone ran the thing at
    debug level.

    Five consecutive runs opened nothing because of it. The real error only
    appears under `LOG_LEVEL=debug`:

    HTTPError: 403 (Forbidden): POST /repos/janpuc/koment/statuses/<sha> Error:
    integration-unauthorized at Proxy.setBranchStatus -> setStatusCheck ->
    processBranch DEBUG: Caught error setting branch status - aborting

    Renovate writes a `renovate/stability-days` commit status on its own branch
    and treats failure as fatal. So `statuses: write` is not optional, and
    neither is the matching permission on the app itself - a token cannot
    request more than the installation holds, so the workflow and the app have
    to be changed together.

    When Renovate does nothing and blames the repository, go to the debug log
    and grep for `integration-unauthorized` before believing it.
  anchor:
    scope: excerpt
    excerpt: '          permission-statuses: write'
    before: |2-
                permission-contents: write
                permission-issues: write
                permission-pull-requests: write
    after: |2
                permission-vulnerability-alerts: read
                permission-workflows: write
  author:
    name: janpuc
    email: janpuc@proton.me
    kind: agent
    source: git-config
