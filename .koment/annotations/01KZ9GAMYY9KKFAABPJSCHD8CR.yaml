spec:
  target:
    file: .github/workflows/renovate.yml
  type: why
  title: Inert without an app, rather than failing nightly
  body: |-
    The whole job is gated on a repository variable so that a checkout without
    an app configured reports what is missing and exits clean. A scheduled
    workflow that fails every night is one people learn to ignore, and then it
    is not a gate any more - the same reason the release workflow guards
    marketplace publication on a variable instead of assuming the secrets exist.

    GITHUB_TOKEN is not an alternative here. Pull requests it opens start no
    workflows, so the required `ci` check would never report and the ruleset
    would never let a Renovate pull request merge. That is the same rule that
    parks every release pull request at `action_required`, arrived at from a
    different direction.

    The variable holds an OAuth client id (`Iv23li...`), not the numeric app id.
    `actions/create-github-app-token` v3 accepts either in its `app-id` input,
    which is worth knowing before "correcting" it to a number.
  anchor:
    scope: excerpt
    excerpt: '        if: env.RENOVATE_BOT_APP_ID == '''''
    before: |2-
                persist-credentials: false

            - name: report that renovate is not configured
    after: |2-
              run: |
                echo "::notice::renovate is inert: set the RENOVATE_BOT_APP_ID variable and the"\
                  "RENOVATE_BOT_PRIVATE_KEY secret to a GitHub App installed on this repository."\
