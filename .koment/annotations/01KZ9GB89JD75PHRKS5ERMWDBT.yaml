    file: .github/workflows/renovate.yml
  type: invariant
  title: Allowed commands and the entrypoint are one decision
  body: |-
    Two halves that only work together. The shared home-operations preset
    attaches helm-docs and helm-schema as post-upgrade tasks; this list permits
    them and `.github/renovate-entrypoint.sh` installs them, because Renovate's
    container carries neither. Allowing a command that is not on PATH fails the
    task just as surely as not allowing it, so changing one half without the
    other reintroduces the bug in a form that looks configured.

    The coupling that makes this load-bearing rather than cosmetic: `mise run
    generate-check` runs helm-docs and fails on a chart README that was not
    regenerated. A Renovate pull request touching the chart without running the
    post-upgrade task therefore fails a required check and can never merge - the
    first run demonstrated exactly that, with `"allowedCommands": []` in the
    log.

    Verify a change here by watching the next run's first lines for `helm-docs
    version` and `helm-schema version`, printed by the entrypoint before
    Renovate starts. Silence there means the tasks will be skipped.
  anchor:
    scope: excerpt
    excerpt: '          RENOVATE_ALLOWED_COMMANDS: ''["^helm-docs ", "^helm-schema "]'''
    before: |2-
                RENOVATE_INTERNAL_CHECKS_FILTER: strict
                RENOVATE_REPOSITORY_CACHE: enabled
                RENOVATE_PRESET_CACHE_PERSISTENCE: "true"
    after: |2-
              with:
                docker-cmd-file: .github/renovate-entrypoint.sh
                docker-user: root
