  body: |-
    servedOverTLS decides whether the capability cookie may demand HTTPS. The
    default deployment is loopback plain HTTP (ADR 0105), where a Secure cookie
    is simply never sent and the write capability silently stops working, so the
    flag follows the connection rather than being set unconditionally.
