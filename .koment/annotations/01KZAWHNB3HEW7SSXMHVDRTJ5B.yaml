spec:
  target:
    file: internal/ui/export.go
  type: gotcha
  title: The uploader drops .github from the artifact, unconditionally
  body: |-
    `actions/upload-pages-artifact` builds its tar with `--exclude=.git
    --exclude=.github`, plus `--exclude=.[^/]*` unless `include-hidden-files`
    is set, and tar matches those against any path component rather than only
    the root. So a published page under `f/.github/` never reaches the site,
    and no setting recovers it - the action's own documentation says
    "Excludes .git and .github regardless."

    That is why this maps rather than configures. `include-hidden-files: true`
    would recover `f/.mise/` and leave `f/.github/` broken, which was five of
    the six pages that 404ed on the published site.

    An earlier version of this annotation blamed Jekyll and said a `.nojekyll`
    marker fixed it. That was wrong, and the marker itself 404ed for the same
    reason it was meant to solve: the uploader had already stripped it. The
    lesson worth keeping is that the artifact and the directory on disk are
    not the same thing, and only the artifact is served. ADR 0123.
  anchor:
    scope: excerpt
    excerpt: func publishableComponent(part string) string {
    before: "\treturn \"f/\" + strings.Join(parts, \"/\") + exportedSuffix\n}\n"
    after: "\tif strings.HasPrefix(part, \".\") {\n\t\treturn dotReplacement + strings.TrimPrefix(part, \".\")\n\t}"
