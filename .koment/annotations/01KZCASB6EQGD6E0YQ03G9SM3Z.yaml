spec:
  target:
    file: .github/workflows/release.yml
  type: why
  title: Plugins publish in parallel with binaries
  body: |-
    Plugins are published alongside the release (like binaries and the image),
    not gated on them. They depend only on please and id-token: write for cosign
    — no binaries needed, no editor VSIX needed — and the tar.gz names are
    derived from directory basename rather than the manifest's name field,
    because name differs between plugins (koment vs koment-opencode) and the
    downstream globs in the signing step match the filename pattern, not a field
    value.
  anchor:
    scope: excerpt
    excerpt: |-
      plugins:
          name: publish plugins
          needs: please
    before: |2
                config-file: release-please-config.json
                manifest-file: .release-please-manifest.json
    after: |2-
          if: needs.please.outputs.released == 'true'
          runs-on: ubuntu-24.04
          permissions:
