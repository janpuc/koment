  title: Plugins job gates merges without ruleset edit
  body: |-
    The ci job's aggregate gate runs under always() so the ruleset-required
    status still resolves even when an upstream job was cancelled or skipped.
    The reject step uses `contains(needs.*.result, ...)` rather than iterating
    jobs: adding plugins here means a failed plugins run blocks a merge without
    a ruleset edit. This is the same pattern the annotation at 01KZ6416GSBA5
    already states — do not duplicate it in branch rules.
