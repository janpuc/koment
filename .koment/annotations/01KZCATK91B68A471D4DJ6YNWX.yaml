  target:
    file: docs/releasing.md
  type: why
  title: Plugins publish in parallel to avoid Go build delay
  body: |-
    The plugins job is listed separately from binaries because its artifacts do
    not depend on the Go build: the plugin is pure JavaScript and metadata. It
    runs in parallel with binaries and image so a slow Go cross-compilation does
    not delay plugin publication. The job needs id-token: write for cosign, same
    as binaries, because a missing OIDC credential surfaces as a five-minute
    browser prompt rather than a fast failure.
  anchor:
    scope: excerpt
    excerpt: '| `plugins` | Two plugin archives (Claude and OpenCode), per-archive cosign signatures, a combined `koment-plugins_<version>_checksums.txt`, and its cosign signature |'
    before: |-
      | Job | Publishes |
      |---|---|
      | `binaries` | six archives, `koment_<version>_checksums.txt`, a cosign signature, and rendered Homebrew/Scoop/WinGet metadata |
    after: |-
      | `image` | `ghcr.io/koment-dev/koment:<version>`, multi-arch, SBOM and provenance, cosign-signed |
      | `editor` | seven VSIX — six carrying that platform's released binary, one universal — signed, attached, then pushed to both marketplaces |
      | `mcp-registry` | MCP Registry metadata via GitHub OIDC |
