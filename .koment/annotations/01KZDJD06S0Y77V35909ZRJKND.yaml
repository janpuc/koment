spec:
  target:
    file: internal/mcp/hooks.go
  type: why
  title: koment_pre_tool bridges the CLI hook and the MCP surface
  body: |-
    The MCP tool deliberately reuses agentpolicy.PreToolOutput rather than
    duplicating the comment-intent classifier. The CLI hook (`koment agents hook
    pre-tool`) and the MCP tool must produce the same decision from the same
    input, so the rules live in one place (agentpolicy.PreToolOutput) and the
    MCP layer only translates JSON shapes. The "allow" decision is signalled by
    an empty object ("{}"); the "deny" decision wraps a permissionDecision
    envelope. Future readers should not refactor this to reimplement the
    classifier in the MCP package - keeping it in agentpolicy is what guarantees
    the hook and the tool agree.
  anchor:
    scope: excerpt
    excerpt: func preTool(_ context.Context, _ *sdk.CallToolRequest, input PreToolInput) (*sdk.CallToolResult, PreToolOutput, error) {
    before: "\tReason   string `json:\"reason,omitempty\"`\n}\n"
    after: "\tpayload, err := json.Marshal(map[string]any{\n\t\t\"tool_name\": input.ToolName,\n\t\t\"tool_input\": map[string]any{"
