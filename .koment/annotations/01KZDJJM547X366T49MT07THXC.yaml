  type: why
  title: Hand-rolled JSON-RPC client over stdio
  body: |-
    The plugin speaks JSON-RPC 2.0 directly over the child's stdio rather than
    importing an MCP client SDK. Two reasons: (1) keeping the dependency surface
    small means the npm package stays a few hundred bytes rather than pulling in
    a transport library the user does not see, and (2) the protocol the plugin
    needs is fixed and narrow (initialize, notifications/initialized,
    tools/call) so a full SDK would carry surface area without buying anything.
    A future MCP feature the plugin needs (resources, prompts) is the trigger to
    add a dependency; today the plugin would not use it.
