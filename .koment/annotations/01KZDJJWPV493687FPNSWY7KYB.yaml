  type: why
  title: Dispose hook shells out; pre-tool uses MCP
  body: |-
    The dispose hook runs the three policy gates via shellout to the koment CLI
    (`koment check`, `koment comments check`, `koment agents check`) rather than
    via MCP. This is the deliberate split ADR 0127 records: the pre-tool gate is
    on the hot path of every edit and benefits from the MCP server the plugin
    already holds; the three gates are end-of-session checks, they print to
    stdout, they exit non-zero on failure, and they operate against the working
    directory in place. Lifting them into MCP tools would require either a
    separate command output format or a process spawn - neither is cheaper than
    the existing shellout, and either widens the trust surface. If a future
    survey shows the gates need to run on a hotter path, the right move is to
    add them as MCP tools; for now they stay where the CLI already does the
    work.
