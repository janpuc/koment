annotations:
  - id: 01KZ2Y5SXBZ5E5JP8EDB0VGH07
    scope: excerpt
    excerpt: '        if [ "$KOMENT_REQUESTED" = "latest" ]; then'
    excerpt_sha256: 320d321113779ef016dcaba56a726d144d8fe4366e0ab68e23d99929108fffba
    last_seen_line: 54
    kind: gotcha
    body: |-
      Resolving "latest" through the release redirect rather than the REST API is
      not a style choice. The API's unauthenticated rate limit is counted per
      source IP, which shared GitHub runners exhaust routinely; when they do, the
      response is an error document that a naive parse turns into an empty tag and
      a confusing download failure. The redirect needs no token, has no such
      limit, and puts the tag in the last path segment.
    created: "2026-08-03"
    author:
      name: janpuc
      email: janpuc@proton.me
      kind: agent
      source: git-config
  - id: 01KZ3B43XDZF9Q67EZR0G2MWD3
    scope: excerpt
    excerpt: '        target="${RUNNER_TEMP}/koment-bin"'
    excerpt_sha256: 53752886a2e35231b094627435963075a956d3ad5fecc4505b33e5eebcf8bde7
    last_seen_line: 89
    kind: invariant
    body: |-
      The setup action adds only a fixed subdirectory of GitHub runner-owned
      RUNNER_TEMP to PATH. The downloaded executable is checksum-verified and the
      requested version is restricted to single-line SemVer before any output is
      written. The zizmor github-env suppression applies only to this fixed runner
      boundary; never derive target from an action input or release data.
    created: "2026-08-03"
