annotations:
  - id: 01KYW1ETDR0HRXBNS70DQPDSXS
    scope: excerpt
    excerpt: "\tcase slices.Contains(found, annotation.LastSeenLine):"
    excerpt_sha256: 7450cbc7e281040d5f824d505f127ba008ac50cfbf1affafeffb4861c67ad392
    last_seen_line: 48
    kind: invariant
    body: |-
      LastSeenLine is a hint, never an anchor (ADR 0009). It is consulted only
      after the excerpt has already been located, and only to choose between ok
      and moved. Corrupting or deleting it must never change whether an annotation
      resolves at all. If a change here makes the search itself consult the line,
      the anchor has stopped being excerpt-based and ADR 0003 has been silently
      reversed.
    created: "2026-07-31"
