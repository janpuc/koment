file: internal/cli/cli.go
annotations:
  - id: 01KYW1ETD1M4B3BQEVKZBG8EPZ
    scope: excerpt
    excerpt: func leadingNonFlag(args []string) (string, []string) {
    excerpt_sha256: ef7ad9cf3f8f44d4c23253024539c8f24b32380dbf37e6f34c554f56f630cbec
    last_seen_line: 106
    kind: gotcha
    body: |-
      flag.FlagSet.Parse stops at the first argument that is not a flag, so
      "koment add main.go --kind why --body x" parses zero flags and reports the
      rest as six stray arguments. The file has to come off the front before Parse
      sees the slice. DESIGN.md documents the file-first order, so the parser
      bends rather than the interface. The CLI tests caught this, not review.
    created: "2026-07-31"
  - id: 01KYW1ETDBHG5PX4SRR8D69J5W
    scope: excerpt
    excerpt: type Servers struct {
    excerpt_sha256: b3107ddc3a01132a304122357d889c240496ae2d1cc0162126ed6d3d4bb74c4c
    last_seen_line: 45
    kind: why
    body: |-
      The servers are injected as function values rather than imported, so that
      package cli links neither the MCP SDK nor the UI templates. ADR 0007
      accepts eight transitive modules only on the condition that they stay
      confined to internal/mcp, and these fields are what actually enforce it.
      Importing internal/mcp or internal/ui here would quietly spend the escape
      hatch the ADR was bought with, and nothing would fail to warn you.

      This is a struct rather than parameters on Run because it was parameters,
      and Run's signature changed every time a server was added — drifting this
      annotation three times in one session. A new server is now a new field.
    created: "2026-07-31"
