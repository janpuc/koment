  - id: 01KZ1P80K41YM1MQ792TQ2ADNG
    scope: excerpt
    excerpt: "\t\tif git.Commit != \"\" {"
    excerpt_sha256: edcf24e26e63a4d5b971c298afefa176c1966282a7e4a19fb539aea6c3a431f1
    last_seen_line: 94
    kind: gotcha
    body: |-
      An absent git or author block stays absent. Writing an empty one back would
      invent provenance the annotation never had, which is worse than having none:
      a reader cannot tell a blank author from an unrecorded one, and ADR 0015
      makes the difference load-bearing.
    created: "2026-08-02"
