  - id: 01KZ1P80NKHWT4D9E0684F8ZD3
    scope: excerpt
    excerpt: func (i *Index) Bootstrap(ctx context.Context, repository Repository, annotations *store.Store) (bool, error) {
    excerpt_sha256: 7570d06960b6888f6afaca9537014ec7106523dbe7b9169d16310f2d06ce1e6e
    last_seen_line: 15
    kind: invariant
    body: |-
      Bootstrap fills an empty index and deliberately does nothing to a populated
      one. Rebuilding on every open would discard anything the index holds that
      YAML does not - which is exactly the interactive state ADR 0016 describes,
      once that path exists. The emptiness check is what keeps this safe to call
      on every startup.
    created: "2026-08-02"
