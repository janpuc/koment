  - id: 01KZ1P80MCZWF9NE41QPQTD19B
    scope: excerpt
    excerpt: func (i *Index) Export(ctx context.Context, repository Repository, into *store.Store) (int, error) {
    excerpt_sha256: a2988271e277b4371aaff1c780fcf3bbc7e4a654420e9a8f58ba2caf6128c6b4
    last_seen_line: 33
    kind: why
    body: |-
      Export writes through store.Save rather than emitting YAML itself. One
      writer means one validation path and one formatter; a second one would drift
      from what add produces on the first formatting change, and the round-trip
      test would start failing for reasons that have nothing to do with the index.
    created: "2026-08-02"
