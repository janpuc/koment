  - id: 01KZ1MMMK02AH44ZM9RSVFGE6T
    scope: excerpt
    excerpt: func (i *Index) migrate(ctx context.Context, statements []string) error {
    excerpt_sha256: 107a283131bff5b2f136416a598a8818d9a5aa7634be516109ecb7fc65bed3f1
    last_seen_line: 86
    kind: why
    body: |-
      A schema change discards the index rather than migrating it. Derived data
      has nothing worth preserving, and a rebuild is always correct where a
      migration can be subtly wrong in ways that only surface months later as a
      query returning the wrong answer. Bump schemaVersion and the next open
      throws the old rows away.
    created: "2026-08-02"
