annotations:
  - id: 01KZ1MMMH87WK4PCW499BY14PK
    scope: excerpt
    excerpt: // Package index holds a queryable copy of the annotations that live in git.
    excerpt_sha256: 65d9f5dc5801c63e6e73e8a437e3d959dd98408b34076dd63ad0ea69c66b4fcc
    last_seen_line: 1
    kind: invariant
    body: |-
      The index is derived and never authoritative. Nothing writes annotations
      here except Rebuild, reading YAML from git, so it can always be deleted and
      reconstructed. That is what makes it safe to keep out of the repository and
      to discard on a schema change: the worst outcome of losing it is a rebuild,
      never a lost annotation. If a write path ever appears that does not go
      through git first, this property is gone and ADR 0022 no longer holds.
    created: "2026-08-02"
    git:
      commit: 80cede7d9e321fa6af7a945004ed73994398c25c
      path: internal/index/index.go
