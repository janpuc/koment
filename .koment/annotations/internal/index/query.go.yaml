annotations:
  - id: 01KZ1MMMNHDDYGJGVKV398XBZQ
    scope: excerpt
    excerpt: func (f Filter) conditionsOn(prefix string) ([]string, []any) {
    excerpt_sha256: b53a9c25537d980bdc5c09e2a7b7973d0601f57b2210c0dd08fd3b7a0ae3ebde
    last_seen_line: 292
    kind: gotcha
    body: |-
      Everything a caller supplies is bound through args. The only things
      concatenated into the query string are a literal table prefix chosen in
      code, "?" placeholders generated from an int count, and a %d LIMIT on an
      int. gosec's taint analysis cannot see that and flags G701, which is
      excluded for this package with that reasoning - and
      TestFilterValuesAreBoundNotInterpolated enforces it, so the exclusion rests
      on a test rather than on a comment.
    created: "2026-08-02"
