  - id: 01KZ1MMMPR740G2XQM7BCARV0A
    scope: excerpt
    excerpt: func (i *Index) Search(ctx context.Context, filter Filter) ([]Annotation, error) {
    excerpt_sha256: 207ba67fce915407065ed7abe3618e338e4e9966a6eea63955931d72d8707d18
    last_seen_line: 128
    kind: why
    body: |-
      Search is full text, not substring: FTS5 on SQLite and a GIN-indexed
      tsvector on Postgres. Both stem, so a search for "annotation" finds a body
      containing "annotating", which strings.Contains cannot do and which is a
      large part of why the index earns its dependency. The two drivers get
      different queries on purpose rather than one query that is mediocre on both.
    created: "2026-08-02"
