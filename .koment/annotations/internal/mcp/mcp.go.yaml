annotations:
  - id: 01KYW1ETDYF6V8Q9JR83DFNSZ1
    scope: excerpt
    excerpt: func warningFor(status anchor.Status) string {
    excerpt_sha256: 74db4ce1c4399a7b72554826524e3ade9df7fed4acfbe27b3f4474fc521bd0ca
    last_seen_line: 159
    kind: invariant
    body: |-
      ADR 0005 requires that a drifted annotation is never served to an agent as
      though it described the current code. The status field alone does not
      achieve that - an agent has no reason to know what "drifted" costs it. Every
      failing status must carry prose that spells out the consequence. A new
      status added to internal/anchor needs a case here, or it will be served
      silently and confidently wrong.
    created: "2026-07-31"
  - id: 01KZ2WD0GQRHG6YRBBVPNJR5VM
    scope: excerpt
    excerpt: func forGet(repositories *repository.Set, named, file string) (repository.Repository, error) {
    excerpt_sha256: 3a9ce3120701906c7ed9c27afe8ed84bfa0e3b2e0b9a83018f62399dc619708f
    last_seen_line: 48
    kind: invariant
    body: |-
      An ambiguous path fails and lists the candidates rather than choosing one.
      Answering from whichever repository the server happens to sit in is a
      confident wrong answer, which is the failure this whole project exists to
      prevent. Search behaves differently on purpose: searching everything and
      naming where each hit came from is useful, where refusing would not be. ADR
      0025.
    created: "2026-08-03"
