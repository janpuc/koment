  - id: 01KZ0JZA8F91P151JJHP9ERT0B
    scope: excerpt
    excerpt: func (m *Metrics) ObserveRepository(resolved map[anchor.Status]int, files int, took time.Duration) {
    excerpt_sha256: 846a7a6a2b96d9bb1298acae57a64a3bbe6c8aca3463fca5e4efad00e3dac97d
    last_seen_line: 134
    kind: invariant
    body: |-
      Every status is set on every sweep, including the ones at zero. Skipping a
      zero would make a drift that someone fixed look identical to a scrape gap:
      the series simply stops, and a dashboard cannot tell "no longer drifting"
      from "no longer reporting". Setting all four unconditionally costs three
      samples and removes the ambiguity.
