  - id: 01KZ0JZABHW296ZPV7DM3D11N4
    scope: excerpt
    excerpt: func (m *Metrics) Serve(ctx context.Context, address string, stderr io.Writer) error {
    excerpt_sha256: a2dc1b2ed6009c861d67b3d43f23e2b9b7d4d2a1703234532b228c6309f7a105
    last_seen_line: 164
    kind: invariant
    body: |-
      Metrics get their own listener and are never mounted on the serving mux. The
      serving port is unauthenticated by design and expected to sit behind an
      ingress; /metrics leaks repository shape through label values and would
      inherit that exposure the moment it shared a port. ADR 0020. If you are
      tempted to add /metrics to the UI handler to save a flag, that is the thing
      this prevents.
    created: "2026-08-02"
