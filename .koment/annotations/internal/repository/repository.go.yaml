  - id: 01KZ2WD0KBB1GW343MXWW8JQHZ
    scope: excerpt
    excerpt: func Load(workingDirectory string) (*Set, error) {
    excerpt_sha256: 53bf63bc9834ae744ea7e88969417fbfadd9282b12a3ea0d8dc0483f64b8a80f
    last_seen_line: 53
    kind: why
    body: |-
      Three configuration sources look like too many until you try to collapse
      them. A laptop must need zero configuration; a container with two mounts
      should not need a mounted file; a deployment with clone URLs and branches
      has nowhere to put them in an env var. Each source covers a case the others
      make worse. Precedence is richest-first so adding one never silently changes
      what a simpler one was already doing.
    created: "2026-08-03"
