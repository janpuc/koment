  - id: 01KZ0BD2G026QVYB3BCP5QBKGJ
    scope: excerpt
    excerpt: var fullCommitSHA = regexp.MustCompile(`^[0-9a-f]{40}$|^[0-9a-f]{64}$`)
    excerpt_sha256: 622e02c6fa16c7529060ff3c32785e8b5b8edfccb125e6855eeaed556498095a
    last_seen_line: 19
    kind: why
    body: |-
      A full SHA is required rather than an abbreviation. Git will happily accept
      a 7-character prefix today and refuse it as ambiguous once the repository
      grows, which turns a stored reference into a time bomb that only fires on
      large histories. Storing the full hash costs 33 characters and removes the
      failure entirely.
    created: "2026-08-02"
