    scope: excerpt
    excerpt: type GitContext struct {
    excerpt_sha256: 0f524c42fc64280c0ebea2e570d083643d29c9c54d11e023921f9cb984051fd8
    last_seen_line: 12
    kind: invariant
    body: |-
      The excerpt and this context answer different questions and neither replaces
      the other. Resolution searches on the excerpt alone; the commit hash is
      consulted only to reconstruct history. Deleting every git block must leave
      every status unchanged - TestProvenanceIsOptional and the anchor tests pin
      that. If a change here makes resolution read the commit, ADR 0003 has been
      reversed without anyone deciding to.
    created: "2026-08-02"
