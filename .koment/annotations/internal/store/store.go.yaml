file: internal/store/store.go
annotations:
  - id: 01KYW1ETDJPEK5QSD4YD6MBD9G
    scope: excerpt
    excerpt: func (s *Store) FromRoot(path string) (string, error) {
    excerpt_sha256: 0ce08ef80dace262146c08c5648839269357690368d44b47468c5c7311fc4cb4
    last_seen_line: 69
    kind: gotcha
    body: |-
      Two bases, deliberately two methods. A person typing at a shell means a path
      relative to their working directory; an MCP client means one relative to the
      repository root. These were a single method named Relative until the MCP
      tests failed with "../../../.. escapes the repository root" - the server was
      resolving agent-supplied paths against its own process cwd, which has
      nothing to do with where the repo is. Do not merge them back into one.
    created: "2026-07-31"
  - id: 01KYW1ETEKHMQP92D0W6GWY27H
    scope: excerpt
    excerpt: func writeAtomically(path string, content []byte) error {
    excerpt_sha256: 51728fb4aead8e27983fac082355bc777858c817073482825afb574d78afa64e
    last_seen_line: 173
    kind: why
    body: |-
      Records are written to a temporary file and renamed into place. A crash
      during a plain write leaves a truncated record, which is indistinguishable
      from a corrupt one and fails to parse on next load - losing every annotation
      for that file. ADR 0004 rejected a memory store on the grounds that koment
      owns its durability guarantees; this is one of the guarantees it owes in
      exchange.
    created: "2026-07-31"
