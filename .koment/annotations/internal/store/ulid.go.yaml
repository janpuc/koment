  - id: 01KYW1ETE3CVB6S0ND70GGZVWM
    scope: excerpt
    excerpt: "\tpaddingBits = ulidLength*bitsPerChar - 8*(timestampBytes+entropyBytes)"
    excerpt_sha256: b3f62f10e117b76946406e5a3c83a1b897d1d01d6fbcfe312d9bf1e08d3b3152
    last_seen_line: 18
    kind: gotcha
    body: |-
      26 Crockford characters carry 130 bits but a ULID holds 128, so the value is
      left-padded by two. Drop the padding and every character shifts: the ids are
      still 26 characters of valid alphabet, and still wrong. Nothing downstream
      can detect that. TestEncodeCrockfordCoversTheWholeValue pins both extremes -
      all-zero bytes must encode to 26 zeros, all-ones to "7" followed by 25 Z.
    created: "2026-07-31"
  - id: 01KZ0AW2AGNWS4W18JRBS8CJ3Z
    scope: excerpt
    excerpt: func encodeCrockford(id [timestampBytes + entropyBytes]byte) string {
    excerpt_sha256: e7e725bab60ddeac9101810df6e344dba98f2ab2188c475081bef1836fbaf43b
    last_seen_line: 40
    kind: why
    body: |-
      Encoding is generate-only: koment mints ids and compares them as strings,
      never parses one back into a timestamp. That is why there is no decoder to
      keep in step with this.
