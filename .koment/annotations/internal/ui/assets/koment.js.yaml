  - id: 01KZ2Z70A78G6AKW92NMTDX81B
    scope: excerpt
    excerpt: '      if (narrow.matches) {'
    excerpt_sha256: ea17802092549ae35cb83fc86c4223b3fe5f498598879e157fa7874332b8c324
    last_seen_line: 74
    kind: why
    body: |-
      On a narrow screen the note already sits directly under the line it
      annotates, in source order, and the code has the full width. Translating
      notes toward a line would break that reading order to chase an alignment
      there is no room for. The transforms are cleared rather than left stale,
      because a resize from wide to narrow would otherwise keep the wide-layout
      offsets.
    created: "2026-08-03"
    author:
      name: janpuc
      email: janpuc@proton.me
      kind: agent
      source: git-config
  - id: 01KZ2Z70F4D6MMSTAVRGEVE0X1
    scope: excerpt
    excerpt: '        floor = placed + note.offsetHeight + 12;'
    excerpt_sha256: 8d70e073350ef1273169f58628a5549330e3aaeee558c104c18607bed0e4da15
    last_seen_line: 96
    kind: invariant
    body: |-
      The floor only ever moves down, which is what guarantees the property this
      layout exists for: when two notes would overlap, the note moves and the code
      never does. Placing a note at max(wanted, floor) can leave it below its
      line, and that is the intended trade — a note slightly out of line is
      readable, code pushed apart by a tall note is not.
    created: "2026-08-03"
    author:
      name: janpuc
      email: janpuc@proton.me
      kind: agent
      source: git-config
