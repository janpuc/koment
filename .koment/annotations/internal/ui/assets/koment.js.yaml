    kind: invariant
    body: |-
      Everything in this file is an enhancement, and it has to stay that way. The
      published tier serves these same files with no server behind them (ADR
      0026), so a reader with scripting off must still get a complete page: the
      tree is <details>, the notes sit in a column beside the code carrying their
      line number, and every control is a real link or form element.

      Nothing here may become the only way to reach something.
