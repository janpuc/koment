file: internal/ui/export.go
annotations:
  - id: 01KYWH5WNQKXXZGQP5KV1Z2PY0
    scope: excerpt
    excerpt: func exportedLinks(page string) links {
    excerpt_sha256: f1be81ef44dbf7b041d6f8a6b0c0b08a39b48156eef7b8bd9d5af67401966cb1
    last_seen_line: 99
    kind: gotcha
    body: |-
      Exported links are relative, never absolute, because GitHub Pages serves a
      project site from a subpath like /koment/ rather than from the domain root.
      An absolute href works when serving locally and 404s once published, which
      is the kind of breakage nobody notices until the site is live. The export
      test asserts no absolute hrefs survive, and walks every generated link to
      check it resolves on disk.
    created: "2026-07-31"
  - id: 01KYWH5WP631S9CCNT9E3JJBFM
    scope: excerpt
    excerpt: func Export(args []string, stderr io.Writer) error {
    excerpt_sha256: fc84da031966d809a3f62cbb2594f4305fd6dd8fc7383315177f02e5aadf3aea
    last_seen_line: 33
    kind: anti-pattern
    body: |-
      Static export exists only to publish koment's own demo site (ADR 0014). ADR
      0013 rejected a static generator as the way to read your own annotations,
      because a snapshot goes stale and that is the exact failure this project
      prevents. The distinction that keeps both true: a demo is a snapshot of a
      named commit, regenerated by CI, that never claims to describe anyone's
      working tree. Do not promote this into a general-purpose feature - it would
      also hand people a way to publish a private codebase by accident.
    created: "2026-07-31"
