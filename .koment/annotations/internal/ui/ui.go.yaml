  - id: 01KYWG17GDDCHE8Q05N8PQ62H2
    scope: excerpt
    excerpt: func Handler(repositories *repository.Set) http.Handler {
    excerpt_sha256: 6c63aa8dd37137a75f60bc3480af777c7c4ade0f2bf867a426ff76bc2e2f5c94
    last_seen_line: 177
    kind: invariant
    body: |-
      Every request rebuilds the whole view from the working tree rather than
      caching it at startup. This is the point of a local tool: what is on screen
      is what is on disk, so editing a file and refreshing shows the drift you
      just caused. Caching would reintroduce exactly the staleness koment exists
      to detect. The cost is re-reading every annotated file per request, which is
      milliseconds at repository scale.
    created: "2026-07-31"
  - id: 01KZ2Z612541PPNB754VBK5E7X
    scope: excerpt
    excerpt: func Handler(repositories *repository.Set) http.Handler {
    excerpt_sha256: 6c63aa8dd37137a75f60bc3480af777c7c4ade0f2bf867a426ff76bc2e2f5c94
    last_seen_line: 182
    kind: why
    body: |-
      Every path carries its repository, including when only one is served. A URL
      whose meaning depends on how the server happens to be configured is a URL
      nobody can share, and the single-repository case is exactly where that would
      go unnoticed until someone deployed a second one.

      Unlike koment_get, which refuses an ambiguous path (ADR 0025), the UI serves
      every configured repository. A person can see which one they are looking at,
      so there is no ambiguity to refuse.
    created: "2026-08-03"
