  - id: 01KYWG17GDDCHE8Q05N8PQ62H2
    scope: excerpt
    excerpt: func Handler(annotations *store.Store) http.Handler {
    excerpt_sha256: f492669e03b96854f636cc0d552fbdbc38aa7fae5b110c6afdf6bf5c433bc61d
    last_seen_line: 97
    kind: invariant
    body: |-
      Every request rebuilds the whole view from the working tree rather than
      caching it at startup. This is the point of a local tool: what is on screen
      is what is on disk, so editing a file and refreshing shows the drift you
      just caused. Caching would reintroduce exactly the staleness koment exists
      to detect. The cost is re-reading every annotated file per request, which is
      milliseconds at repository scale.
    created: "2026-07-31"
  - id: 01KZ0JZWD1PHB528YETDFT4F6R
    scope: excerpt
    excerpt: func repositoryRoot() (string, error) {
    excerpt_sha256: d43894663bad713194b1fcf847bef10b4b9e7e071b2758bca38f957edec1d471
    last_seen_line: 93
    kind: gotcha
    body: |-
      KOMENT_REPO is checked before the working directory because in a container
      the working directory is a mount point, not somewhere a person navigated to.
      Without it, running the image with the repository mounted anywhere other
      than the image's WORKDIR silently serves nothing, and the failure looks like
      an empty store rather than a misconfiguration.
    created: "2026-08-02"
