    body: |-
      A drifted or orphaned annotation is deliberately rendered away from the
      code: its excerpt is shown struck through and labelled as no longer present,
      never laid over the current source. Anchoring a stale note to whatever now
      occupies that line would assert something false, which is worse than showing
      nothing. ADR 0005 requires this in the MCP payload; this is the same
      guarantee expressed visually.
