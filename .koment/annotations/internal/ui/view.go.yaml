annotations:
  - id: 01KYWG17GJZTM91CZ23D8B1RK8
    scope: excerpt
    excerpt: func describe(resolution anchor.Resolution) note {
    excerpt_sha256: 45bb566f0432455983125c993a33bab2054ec5e05d10d52979ff8bb6e76c5d51
    last_seen_line: 198
    kind: invariant
    body: |-
      A drifted or orphaned annotation is deliberately rendered away from the
      code: its excerpt is shown struck through and labelled as no longer present,
      never laid over the current source. Anchoring a stale note to whatever now
      occupies that line would assert something false, which is worse than showing
      nothing. ADR 0005 requires this in the MCP payload; this is the same
      guarantee expressed visually.
    created: "2026-07-31"
  - id: 01KZ2Z60RSWSH9D3D2XSKBGWKF
    scope: excerpt
    excerpt: func buildFile(annotations *store.Store, file string, resolutions []anchor.Resolution) (*fileView, error) {
    excerpt_sha256: 4d1f2ec6071083f6330bcf223573a3182373a0e002de5ce918bc32cf87a840f6
    last_seen_line: 186
    kind: why
    body: |-
      Notes are deliberately not attached to their line's row. When they were,
      each line was a grid row whose height was set by the tallest cell in it, so
      a long note stretched its line and pushed the surrounding code apart.
      Measured: ten annotations on a five-line const block rendered as about
      thirty-five lines, and the code stopped being readable as code.

      Lines are now uniform and the notes carry their line number instead. The
      browser nudges each note down to meet its line and moves the note, never the
      code, when two would collide. With scripting off they stay in a column in
      line order, which is correct but less precise — that degradation is the
      price of the published tier having no server (ADR 0026).
    created: "2026-08-03"
