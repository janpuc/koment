# yaml-language-server: $schema=https://raw.githubusercontent.com/janpuc/koment/main/schema/v1alpha/policy.schema.json
apiVersion: koment.dev/v1alpha
kind: Policy
spec:
  comments:
    mode: strict
    intrinsic:
      - toolchain-directive
      - generated-marker
      - upstream-link
      - deprecated
      - public-api
    generatedPaths:
      - '**/*.gen.go'
      - '**/*.generated.go'
    vendoredPaths:
      - vendor/**
  agents:
    adapters:
      - agents
      - claude
      - copilot
      - cursor
      - codex
      - opencode
    principles:
      - back-compat-evidence
