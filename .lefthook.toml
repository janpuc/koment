[pre-commit]
parallel = true

[pre-commit.commands.format-go]
glob = "*.go"
run = "gofmt -w {staged_files}"
stage_fixed = true

[pre-commit.commands.annotations]
run = "mise run annotations"

[pre-commit.commands.comments]
run = "mise run comments"

[pre-commit.commands.agent-policy]
run = "mise run agent-policy"

[commit-msg]
parallel = true

[commit-msg.commands.commit-fmt]
run = "./scripts/commitlint.sh <<< \"$(head -n1 {1})\""
