apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "koment.fullname" . }}
  labels: {{- include "koment.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "koment.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "koment.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "koment.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: koment
          image: {{ include "koment.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: {{ include "koment.args" . }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: configuration
              mountPath: /config
              readOnly: true
            {{- if .Values.github.existingSecret }}
            - name: github
              mountPath: /secrets/github
              readOnly: true
            {{- end }}
            {{- if .Values.auth.existingSecret }}
            - name: auth
              mountPath: /secrets/auth
              readOnly: true
            {{- end }}
      volumes:
        - name: configuration
          configMap:
            name: {{ include "koment.fullname" . }}
        {{- if .Values.github.existingSecret }}
        - name: github
          secret:
            secretName: {{ .Values.github.existingSecret | quote }}
            items:
              - key: {{ .Values.github.tokenKey | quote }}
                path: {{ .Values.github.tokenKey | quote }}
        {{- end }}
        {{- if .Values.auth.existingSecret }}
        - name: auth
          secret:
            secretName: {{ .Values.auth.existingSecret | quote }}
            items:
              - key: {{ .Values.auth.credentialsKey | quote }}
                path: {{ .Values.auth.credentialsKey | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- toYaml . | nindent 8 }}
      {{- end }}
