{{- if .Values.ingress.enabled }}
{{- /*
  koment has no authentication. Exposing it through an ingress publishes every
  annotation in the repository to anyone who can reach the host. ADR 0011.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "koment.fullname" . }}
  labels: {{- include "koment.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ default "Prefix" .pathType }}
            backend:
              service:
                name: {{ include "koment.fullname" $ }}
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
