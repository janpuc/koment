apiVersion: v1
kind: Service
metadata:
  name: {{ include "koment.fullname" . }}
  labels: {{- include "koment.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
    {{- if .Values.metrics.enabled }}
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector: {{- include "koment.selectorLabels" . | nindent 4 }}
