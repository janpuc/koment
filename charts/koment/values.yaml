image:
  repository: ghcr.io/janpuc/koment
  # Defaults to the chart's appVersion, which release-please keeps in step.
  tag: ""
  pullPolicy: IfNotPresent

# What the container serves. Only read-only surfaces are supported: ADR 0011
# makes the unauthenticated posture conditional on nothing being writable, and
# the chart deploys no authentication.
#   ui              the web view
#   mcp-http        MCP over HTTP, JSON responses
#   mcp-streamable  MCP over HTTP, server-sent events
mode: ui

# The repository koment serves. It is mounted rather than baked into the image,
# so one image serves any checkout.
repository:
  # existingClaim mounts a PVC you manage. Populating it is your job — koment
  # does not clone.
  existingClaim: ""
  # Or an emptyDir plus an init container that clones. Credentials for a
  # private repository are your responsibility.
  clone:
    enabled: false
    url: ""
    ref: main
    image: alpine/git:latest

replicaCount: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# koment reads files and serves HTTP. It needs nothing else.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
