image:
  # -- Container image repository.
  repository: ghcr.io/janpuc/koment
  # -- Image tag. Defaults to the chart's appVersion.
  tag: ""
  # -- Image digest. Set it to pin the exact image a tag currently points at.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent

# -- Number of service replicas. Each holds its own rebuilt snapshot.
replicaCount: 1

# -- Repositories this service assigns identity to and serves. `id` is the
# stable identity in URLs and credentials; moving a repository never changes it.
repositories:
  - id: koment
    name: koment
    provider: github
    remote: janpuc/koment
    defaultBranch: main
    default: true

# -- How often each repository's branch is resolved to a new immutable commit
# snapshot.
syncInterval: 1m

github:
  # -- Name of an existing Secret holding the provider token. Required for
  # private repositories and for reviewed writes; without it the synchronizer
  # calls GitHub unauthenticated.
  existingSecret: ""
  # -- Key inside `github.existingSecret` that holds the token.
  tokenKey: github-token

auth:
  # -- CIDRs allowed to assert forwarded human identity. The default trusts only
  # loopback, so direct cluster traffic fails closed.
  trustedProxies:
    - 127.0.0.1/32
  # -- Allow identities asserted by a trusted proxy to create reviewed
  # annotations.
  humanWrites: false
  # -- Name of an existing Secret holding hashed, scoped agent credentials.
  existingSecret: ""
  # -- Key inside `auth.existingSecret` that holds the credentials file.
  credentialsKey: credentials.yaml

serviceAccount:
  # -- Create a ServiceAccount for the service.
  create: true
  # -- Name of the ServiceAccount. Generated from the release when empty.
  name: ""
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

service:
  # -- Service type for the authenticated application port.
  type: ClusterIP
  # -- Port serving the UI, MCP, and the health endpoints.
  port: 8080

metrics:
  # -- Expose Prometheus metrics on their own listener, so an ingress for the
  # application port cannot expose them with it.
  enabled: false
  # -- Port for the metrics listener.
  port: 9090
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor.
    enabled: false
    # -- Scrape interval.
    interval: 30s
    # -- Scrape timeout.
    scrapeTimeout: 10s
    # -- Extra labels for the ServiceMonitor, used by Prometheus selectors.
    labels: {}
  dashboard:
    # -- Ship the Grafana dashboard as a sidecar-discoverable ConfigMap.
    enabled: false
    # -- Label the Grafana sidecar watches for.
    label: grafana_dashboard
    # -- Value of the label the Grafana sidecar watches for.
    labelValue: "1"

ingress:
  # -- Create an Ingress for the application port. It carries authentication;
  # only the health endpoints are public.
  enabled: false
  # -- IngressClass name.
  className: ""
  # -- Annotations to add to the Ingress.
  annotations: {}
  # -- Ingress hosts and paths.
  hosts: []
  # -- Ingress TLS configuration.
  tls: []

networkPolicy:
  # -- Restrict ingress to the pod to the rules below.
  enabled: false
  # -- Ingress rules applied when `networkPolicy.enabled` is set. Empty denies
  # all inbound traffic.
  ingress: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget.
  enabled: false
  # -- Minimum available pods during voluntary disruption.
  minAvailable: 1

# -- Resource requests and limits. Snapshots are held in memory, so the memory
# limit scales with repository size rather than with request volume.
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

# -- Pod-level security context. The image ships a static binary and runs as a
# fixed non-root user.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

# -- Node selector for pod assignment.
nodeSelector: {}
# -- Tolerations for pod assignment.
tolerations: []
# -- Affinity rules for pod assignment.
affinity: {}
# -- Topology spread constraints for pod assignment.
topologySpreadConstraints: []
# -- Annotations to add to the pod.
podAnnotations: {}

tests:
  image:
    # -- Image `helm test` uses to probe the service.
    repository: curlimages/curl
    # -- Tag of the test image, recorded alongside the digest that pins it.
    tag: "8.16.0"
    # -- Digest that pins the test image, so a moving tag cannot change it.
    digest: sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    # -- Pull policy for the test image.
    pullPolicy: IfNotPresent
    # -- Numeric user id of the pinned test image. Kubernetes cannot verify
    # `runAsNonRoot` against an image that names its user instead of numbering
    # it, so the ids are pinned with the digest they belong to.
    runAsUser: 101
    # -- Numeric group id of the pinned test image.
    runAsGroup: 102
