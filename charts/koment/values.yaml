image:
  repository: ghcr.io/janpuc/koment
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

replicaCount: 1

repositories:
  - id: koment
    name: koment
    provider: github
    remote: janpuc/koment
    defaultBranch: main
    default: true

syncInterval: 1m

github:
  existingSecret: ""
  tokenKey: github-token

auth:
  trustedProxies:
    - 127.0.0.1/32
  humanWrites: false
  existingSecret: ""
  credentialsKey: credentials.yaml

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080

metrics:
  enabled: false
  port: 9090
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
  dashboard:
    enabled: false
    label: grafana_dashboard
    labelValue: "1"

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts: []
  tls: []

networkPolicy:
  enabled: false
  ingress: []

podDisruptionBudget:
  enabled: false
  minAvailable: 1

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
podAnnotations: {}

tests:
  image:
    repository: curlimages/curl
    tag: "8.16.0"
    digest: sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    pullPolicy: IfNotPresent
