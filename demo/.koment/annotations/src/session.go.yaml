  - id: 01KZ0B8PPC18KQPW55FA8J1F9F
    scope: excerpt
    excerpt: "\treturn t.Expiry.Before(now.Add(-clockSkew))"
    excerpt_sha256: a6a324ad07f13b791ad325edaf27e624a70e7dd44c06569c3c532e6ca42fb309
    last_seen_line: 17
    kind: gotcha
    body: |-
      The skew subtraction is deliberate. Without it, clients whose clock runs a
      few seconds fast are logged out mid-request, and the failure looks like a
      flaky backend rather than a clock problem. Bit us in #412.
