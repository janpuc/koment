  - id: 01KZ0B95Y0GNX82MMTS77RAN48
    scope: excerpt
    excerpt: "\treturn !t.Expired(now) && time.Until(t.Expiry) < renewalWindow"
    excerpt_sha256: 9bda3df3385662b964d7cc2996cc28d7d67dcee9191163d063ad6304722e88a3
    last_seen_line: 21
    kind: why
    body: |-
      Renewal is offered only in the last hour of a token life. Earlier renewal
      was tried and produced a stampede: every active client refreshed at once on
      deploy, because their tokens had all been issued together.
