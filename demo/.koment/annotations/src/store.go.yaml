  - id: 01KZ0B8PQG92RWS705VEEQ6WHN
    scope: excerpt
    excerpt: func (s *Store) Get(id string) (Token, error) {
    excerpt_sha256: 3e1ef11a8beba5668d601ed0a7f02daf9d842c1e77d5d02c11fc488ce2265ee0
    last_seen_line: 33
    kind: invariant
    body: |-
      Get takes a read lock, not a write lock. Anything added here that mutates
      the map must take the write lock instead, or concurrent reads will race and
      the detector will only catch it under load.
