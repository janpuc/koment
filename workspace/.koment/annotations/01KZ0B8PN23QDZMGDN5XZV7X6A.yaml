  target:
    file: session/store.go
  type: why
  body: |-
    Put overwrites silently. Sessions are keyed by an id the caller already
    holds, so a second Put for the same id is a refresh rather than a collision,
    and returning an error would make every renewal path handle a case that
    cannot happen.
  anchor:
    scope: excerpt
    excerpt: func (s *Store) Put(id string, token Token) {
    before: "\treturn &Store{sessions: make(map[string]Token)}\n}\n"
    after: "\ts.mu.Lock()\n\tdefer s.mu.Unlock()\n\ts.sessions[id] = token"
